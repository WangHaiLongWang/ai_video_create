[project]
name = "ai-video-create-api"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "performance: performance benchmark tests (deselect with '-m not performance')",
    "external: tests requiring external binaries such as FFmpeg (deselect with '-m not external')",
]
